<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>内容库</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#0d0f12;color:#e7eaef;
       display:flex;align-items:center;justify-content:center;
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
            "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased}
  .w{width:min(340px,86vw)}
  .t{font-size:15px;font-weight:600;letter-spacing:.3px;margin:0 0 4px}
  .s{font-size:12px;color:#7d8695;margin:0 0 20px}
  .f{position:relative}
  input{width:100%;background:#14171c;color:#e7eaef;border:1px solid #242a33;
        border-radius:10px;padding:12px 42px 12px 13px;font:15px/1.4 ui-monospace,
        SFMono-Regular,Consolas,monospace;outline:none;transition:border-color .15s}
  input:focus{border-color:#3d6fd4}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
       width:32px;height:32px;display:flex;align-items:center;justify-content:center;
       cursor:pointer;opacity:.45;user-select:none;font-size:14px}
  .eye:hover{opacity:.85}
  button{width:100%;margin-top:12px;background:#3d6fd4;color:#fff;border:0;
         border-radius:10px;padding:12px;font-size:14px;font-weight:600;
         cursor:pointer;transition:opacity .15s}
  button:hover:not(:disabled){opacity:.9}
  button:disabled{opacity:.5;cursor:default}
  .m{margin-top:12px;font-size:12px;min-height:17px;color:#e2585d}
  .m.ok{color:#3fbf7f}
  .p{margin-top:22px;font-size:11px;color:#4c545f;text-align:center}
</style>
</head>

function b64(s){
  var t=atob(s),n=t.length,a=new Uint8Array(n);
  for(var i=0;i<n;i++)a[i]=t.charCodeAt(i);
  return a;
}
function hex(s){
  var n=s.length>>1,a=new Uint8Array(n);
  for(var i=0;i<n;i++)a[i]=parseInt(s.substr(i*2,2),16);
  return a;
}
function cat(){
  var t=0,i;
  for(i=0;i<arguments.length;i++)t+=arguments[i].length;
  var o=new Uint8Array(t),p=0;
  for(i=0;i<arguments.length;i++){o.set(arguments[i],p);p+=arguments[i].length;}
  return o;
}
async function derive(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
      "PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:hex(S),iterations:I,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
}

    {name:"AES-GCM",iv:iv,additionalData:new Uint8Array(0),tagLength:128},
    key,cat(body,tag));
  return new TextDecoder().decode(pt);

var busy=false;
async function go(){
  if(busy)return;
  var v=k.value.trim();
  if(!v){m.className="m";m.textContent="请输入密钥";return;}
  busy=true;b.disabled=true;m.className="m";m.textContent="正在验证…";
  try{
    var html=await open_(v);
    window.__K=v;
    m.className="m ok";m.textContent="验证通过，正在载入…";
    document.open();document.write(html);document.close();
  }catch(err){
    m.className="m";m.textContent="密钥不正确";
    b.disabled=false;busy=false;
    k.value="";k.focus();
  }
